<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAYFOLD tile</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
        background: #05080d;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
          <path d="M64 0H0V64" fill="none" stroke="#17222c" stroke-width="1" />
        </pattern>
        <radialGradient id="vignette" cx="50%" cy="46%" r="74%">
          <stop offset="42%" stop-color="#05080d" stop-opacity="0" />
          <stop offset="100%" stop-color="#010306" stop-opacity="0.82" />
        </radialGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f5a623" stop-opacity="0.16" />
          <stop offset="60%" stop-color="#f5a623" stop-opacity="0.04" />
          <stop offset="100%" stop-color="#f5a623" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2f8ff" />
          <stop offset="45%" stop-color="#9fb3c8" />
          <stop offset="100%" stop-color="#42566b" />
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e8fbff" stop-opacity="0.34" />
          <stop offset="55%" stop-color="#9fe9ff" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#ff8fe6" stop-opacity="0.18" />
        </linearGradient>
        <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0a1118" />
          <stop offset="100%" stop-color="#060b11" />
        </linearGradient>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="14" result="wide" />
          <feGaussianBlur stdDeviation="4" result="tight" />
          <feMerge>
            <feMergeNode in="wide" />
            <feMergeNode in="tight" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="34" />
        </filter>
      </defs>

      <rect width="1024" height="1024" fill="#05080d" />
      <rect width="1024" height="1024" fill="url(#grid)" opacity="0.5" />
      <ellipse cx="560" cy="500" rx="540" ry="440" fill="url(#halo)" />

      <!-- corner screws -->
      <g fill="#0b1218" stroke="#26343f" stroke-width="2">
        <circle cx="96" cy="96" r="9" />
        <circle cx="928" cy="96" r="9" />
        <circle cx="96" cy="928" r="9" />
        <circle cx="928" cy="928" r="9" />
      </g>

      <!-- board -->
      <rect x="152" y="152" width="720" height="720" rx="16" fill="url(#board)" stroke="#26343f" stroke-width="3" />
      <g stroke="#1a2632" stroke-width="1.5">
        <path d="M272 152v720M392 152v720M512 152v720M632 152v720M752 152v720" />
        <path d="M152 272h720M152 392h720M152 512h720M152 632h720M152 752h720" />
      </g>

      <!-- empty cell crosses -->
      <g stroke="#2a3a48" stroke-width="2" opacity="0.55">
        <path d="M206 452h12M212 446v12M326 452h12M332 446v12M566 452h12M572 446v12M686 452h12M692 446v12M806 452h12M812 446v12" />
        <path d="M206 212h12M212 206v12M326 212h12M332 206v12M566 212h12M572 206v12M686 212h12M692 206v12M806 212h12M812 206v12" />
        <path d="M206 572h12M212 566v12M326 572h12M332 566v12M566 572h12M572 566v12M686 572h12M692 566v12" />
        <path d="M206 692h12M212 686v12M326 692h12M332 686v12M446 692h12M452 686v12M566 692h12M572 686v12M686 692h12M692 686v12M806 692h12M812 686v12" />
        <path d="M206 812h12M212 806v12M326 812h12M332 806v12M446 812h12M452 806v12M566 812h12M572 806v12M686 812h12M692 806v12M806 812h12M812 806v12" />
        <path d="M446 212h12M452 206v12M446 332h12M452 326v12M446 452h12M452 446v12" />
      </g>

      <!-- beam glow -->
      <g filter="url(#glow)">
        <path d="M156 452H452V332H666" fill="none" stroke="#f5a623" stroke-width="18" stroke-opacity="0.34" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M156 452H452V332H666" fill="none" stroke="#ffd79a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M730 320L812 212" fill="none" stroke="#38e1ff" stroke-width="9" stroke-opacity="0.35" stroke-linecap="round" />
        <path d="M730 320L812 212" fill="none" stroke="#bdf6ff" stroke-width="3" stroke-linecap="round" />
        <path d="M730 344L812 452" fill="none" stroke="#ff4fd8" stroke-width="9" stroke-opacity="0.35" stroke-linecap="round" />
        <path d="M730 344L812 452" fill="none" stroke="#ffc2f2" stroke-width="3" stroke-linecap="round" />
        <path d="M724 332H810" fill="none" stroke="#f5a623" stroke-width="9" stroke-opacity="0.32" stroke-linecap="round" />
        <path d="M724 332H810" fill="none" stroke="#ffd79a" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- targets -->
      <g filter="url(#glow)">
        <path d="M812 174L850 212L812 250L774 212Z" fill="#f5a623" fill-opacity="0.14" stroke="#ffd79a" stroke-width="6" stroke-linejoin="round" />
        <path d="M812 294L850 332L812 370L774 332Z" fill="#f5a623" fill-opacity="0.2" stroke="#f5a623" stroke-width="6" stroke-linejoin="round" />
        <path d="M812 414L850 452L812 490L774 452Z" fill="#ff4fd8" fill-opacity="0.16" stroke="#ff8fe6" stroke-width="6" stroke-linejoin="round" />
      </g>

      <!-- prism -->
      <path d="M664 300L664 364L720 332Z" fill="url(#glass)" stroke="#d8f6ff" stroke-width="3" stroke-opacity="0.72" stroke-linejoin="round" />

      <!-- mirrors -->
      <g>
        <g transform="translate(452 452) rotate(-45)">
          <rect x="-46" y="-7" width="92" height="14" rx="7" fill="url(#metal)" stroke="#e9f4ff" stroke-width="2" stroke-opacity="0.8" />
          <rect x="-46" y="-2" width="92" height="4" fill="#ffffff" opacity="0.55" />
        </g>
        <g transform="translate(452 332) rotate(45)">
          <rect x="-46" y="-7" width="92" height="14" rx="7" fill="url(#metal)" stroke="#e9f4ff" stroke-width="2" stroke-opacity="0.8" />
          <rect x="-46" y="-2" width="92" height="4" fill="#ffffff" opacity="0.55" />
        </g>
      </g>

      <!-- emitter -->
      <g filter="url(#glow)">
        <circle cx="166" cy="452" r="13" fill="#ffd79a" />
      </g>
      <rect x="118" y="424" width="40" height="56" rx="7" fill="#0b1218" stroke="#f5a623" stroke-width="4" />
      <path d="M152 452h10" stroke="#ffd79a" stroke-width="6" stroke-linecap="round" />

      <text x="512" y="958" text-anchor="middle" fill="#8fa3b8" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="34" font-weight="600" letter-spacing="15">RAYFOLD</text>
      <text x="512" y="992" text-anchor="middle" fill="#5e7288" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="14" font-weight="500" letter-spacing="6">DAILY OPTICAL LOGIC</text>

      <rect width="1024" height="1024" fill="url(#vignette)" />
    </svg>
  </body>
</html>
